# Tour fidelity on the CPU (no Kaggle GPU hours, 27 Oct): the trained model vs the tour's smear filter / SH band cut / compressed PLY,
# rendered from held-out frames (final/tour_fidelity.py, final/cpu_render.py). Start: change "n" in colab/real_scenes/v3/FIDELITY.json
# and push. Results: hf://datasets/<user>/namma-v3-out/fidelity/<time>/.
name: tour-fidelity
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/FIDELITY.json]
concurrency:
  group: tour-fidelity
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q huggingface_hub numpy pillow pandas
      - name: CPU tour fidelity check
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: python colab/real_scenes/v3/fidelity_gh.py
