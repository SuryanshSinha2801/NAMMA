# FreeFix (MIT, SDXL backbone) on a finished run, on Kaggle's free T4, then a tour of the refined model + screenshots
# (v3/freefix_gh.py -> final/freefix_test.py). Start: change "n" in colab/real_scenes/v3/FREEFIX.json and push, when no other
# Kaggle job is running. Results: hf://datasets/<user>/namma-v3-out/freefix/<time>/ (report, sheet, tour link).
name: freefix test
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/FREEFIX.json]
concurrency:
  group: freefix-test
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
            scripts/site_look
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle==2.2.5 huggingface_hub numpy pillow playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: Kaggle FreeFix job + tour
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: python colab/real_scenes/v3/freefix_gh.py
      - name: Screenshots
        if: env.TOUR_RUN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: |
          sleep 90
          python scripts/site_look/look.py
