# Photo -> 3D splat world with FlashWorld on its free ZeroGPU Space (v3/flashworld_gh.py), viewer published + screenshots.
# Start: change "n" in colab/real_scenes/v3/FLASHWORLD.json and push. No Kaggle. Results: hf://datasets/<user>/namma-v3-out/flashworld/<time>/.
name: flashworld
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/FLASHWORLD.json]
concurrency:
  group: flashworld
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
            scripts/site_look
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q huggingface_hub gradio_client numpy pillow playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: FlashWorld (ZeroGPU Space) + viewers
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: python colab/real_scenes/v3/flashworld_gh.py
      - name: Screenshots
        if: env.TOUR_RUN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: |
          sleep 90
          python scripts/site_look/look.py
