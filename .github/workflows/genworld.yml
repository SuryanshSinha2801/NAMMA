# NAMMA World v0 (Plan B, CPU): one ordinary photo / video frame -> a 3D world (metric depth, cut at depth jumps, LaMa fills what is
# hidden and the border), scored against the real neighbouring frames. Start: change "n" in colab/real_scenes/v3/GENWORLD.json and push.
# Results: hf://datasets/<user>/namma-v3-out/genworld/<time>/.
name: genworld
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/GENWORLD.json]
concurrency:
  group: genworld
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
            scripts/site_look
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 > /dev/null && df -h /
      - run: pip install -q huggingface_hub numpy pillow pandas playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: NAMMA World
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: python colab/real_scenes/v3/genworld_gh.py
      - name: Screenshots
        if: env.TOUR_RUN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: |
          sleep 90
          python scripts/site_look/look.py
