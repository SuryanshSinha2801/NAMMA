# Object-by-object 3D demo on the hotel room (CPU runner + free ZeroGPU Space, no Kaggle): a COCO detector finds the furniture in the frames,
# SAM 3 + SAM 3D Objects rebuild each one in full 3D, viewer page published + screenshots (v3/sam3d_gh.py).
# Start: change "n" in colab/real_scenes/v3/SAM3D.json and push. Results: hf://datasets/<user>/namma-v3-out/sam3d/<time>/.
name: sam3d demo
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/SAM3D.json]
concurrency:
  group: sam3d-demo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q huggingface_hub gradio_client numpy pillow playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: Objects -> 3D -> viewer
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: python colab/real_scenes/v3/sam3d_gh.py
