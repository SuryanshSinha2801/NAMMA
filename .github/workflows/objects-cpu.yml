# Object layer v3 on the CPU (owner 27 Oct: no Kaggle GPU hours): refines a finished object run (final/objects_refine.py),
# then two tours (real colours + labels / click / search, and tinted) + screenshots. Start: change "n" in
# colab/real_scenes/v3/OBJECTS_CPU.json and push. Results: hf://datasets/<user>/namma-v3-out/objects/<time>/.
name: objects-cpu
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/OBJECTS_CPU.json]
concurrency:
  group: objects-cpu
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
            scripts/site_look
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && sudo apt-get install -y -qq libegl1 libgl1 libgomp1 > /dev/null && df -h /
      - run: pip install -q huggingface_hub numpy pillow pandas playwright==1.49.1 && python -m playwright install --with-deps chromium
      - name: CPU object refine + tours
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
        run: python colab/real_scenes/v3/objects_cpu_gh.py
      - name: Screenshots
        if: env.TOUR_RUN != ''
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
          LOOK_QUERY: sofa
        run: |
          sleep 90
          python scripts/site_look/look.py
