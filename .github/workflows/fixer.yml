# NVIDIA Fixer smoke test (plan of 30 Oct, run 4 only): render off-path tour views on the CPU, fix them with Fixer on a Kaggle T4,
# before/after sheet. Start: change "n" in colab/real_scenes/v3/FIXER.json and push. Results: hf://datasets/<user>/namma-v3-out/fixer/<time>/.
name: fixer
on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/FIXER.json]
concurrency:
  group: kaggle-gpu
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle==2.2.5 six huggingface_hub numpy pillow pandas
      - name: Fixer smoke test
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
        run: python colab/real_scenes/v3/fixer_gh.py
