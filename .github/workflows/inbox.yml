# Video in -> tour link out, with no edits: the NAMMA Capture app (or anyone) puts <job>/video.mp4 + meta.json + status.json
# ("uploaded") in the private HF dataset <hf user>/namma-inbox, then pushes colab/real_scenes/v3/inbox/<job>.json to this branch.
# This workflow: v3/inbox.py pick (oldest waiting job, only when no Kaggle job runs) -> gh_run.py (source hf:..., PIPELINE.json
# preset) -> results + tour -> status.json 'done' with the link (private). Runs longer than one GitHub job (6 h) are collected by
# the follow-up jobs. Links never appear in these logs. See docs/VIDEO_TO_TOUR.md.
name: inbox

on:
  push:
    branches: [claude/wonderful-cori-i3fn41]
    paths: [colab/real_scenes/v3/inbox/**]
  workflow_dispatch:

concurrency:
  group: namma-inbox
  cancel-in-progress: false

env:
  KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN || secrets.KAGGLE_TOKEN }}
  HF_TOKEN: ${{ secrets.HF_TOKEN || secrets.HUGGINGFACE_WRITE_TOKEN }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      PICK: ""
    outputs:
      still_running: ${{ steps.go.outputs.still_running }}
      job: ${{ steps.pick.outputs.job }}
    steps: &steps
      - name: Free disk for big videos (an 8 GB phone video is downloaded, then sent to Kaggle)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            colab/real_scenes/v3
            colab/real_scenes/final
            scripts/site_look
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q kaggle==2.2.5 six huggingface_hub pandas pillow
      - id: pick
        run: python colab/real_scenes/v3/inbox.py pick $PICK
      - id: go
        if: steps.pick.outputs.action != 'wait'
        env:
          RUN_JSON: job_run.json
          INBOX_JOB: ${{ steps.pick.outputs.job }}
        run: python colab/real_scenes/v3/gh_run.py
      - if: failure() && steps.pick.outputs.job != ''
        run: python colab/real_scenes/v3/inbox.py status "${{ steps.pick.outputs.job }}" failed reason="the GitHub run stopped with an error (inbox workflow, run ${{ github.run_id }})"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inbox-${{ github.job }}
          path: |
            out/*.json
            out/*/metrics.json
            out/*.log
          if-no-files-found: ignore
  collect1:
    env:
      PICK: --collect
    needs: run
    if: needs.run.outputs.still_running == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    outputs:
      still_running: ${{ steps.go.outputs.still_running }}
    steps: *steps
  collect2:
    env:
      PICK: --collect
    needs: collect1
    if: needs.collect1.outputs.still_running == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps: *steps
